name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Correr tests
        # No requiere ANTHROPIC_API_KEY ni GEMINI_API_KEY: los tests solo
        # ejercitan el dispatcher de tools en modo mock, no llaman al LLM.
        run: pytest tests/ -v
